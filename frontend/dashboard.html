<!DOCTYPE html>
<html>
<head>
  <title>Dashboard</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="css/style.css">
  <script src = "https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>

<body>

<div class="navbar p-4 flex justify-between items-center">
  <h1 class="text-xl font-bold" style="color: var(--primary-color);">Student Dashboard</h1>

  <div class="flex gap-3">
    <button onclick="toggleTheme()" class="btn-primary px-4 py-2 rounded">🌙</button>
    <button onclick="changePassword()" class = "btn-primary px-4 py-2 rounded">Change Password</button>
    <button onclick="logout()" class="btn-danger px-4 py-2 rounded">Logout</button>
  </div>
</div>

<div class="p-6">

  <div class="card p-6 mb-4">
    <h2 id="studentName" class="text-xl font-bold"></h2>
    <p id="studentInfo"></p>
  </div>

  <div class="grid grid-cols-3 gap-4 mb-6">

  <div class="card p-4 text-center">
    <h3>Average Marks</h3>
    <p id="avgMarks" class="text-xl font-bold"></p>
  </div>

  <div class="card p-4 text-center">
    <h3>Attendance</h3>
    <p id="avgAttendance" class="text-xl font-bold"></p>
  </div>

  <div class="card p-4 text-center">
    <h3>Status</h3>
    <p id="status" class="text-xl font-bold"></p>
  </div>

</div>

  <div class="card p-6">
    <h2 class="text-lg font-bold mb-3">Performance</h2>

    <table class="w-full border">
      <thead>
        <tr class="border-b">
          <th>Subject</th>
          <th>Marks</th>
          <th>Attendance</th>
        </tr>
      </thead>

      <tbody id="studentTable"></tbody>
    </table>

    <canvas id = "marksChart" class="mt-6"></canvas>

  </div>

</div>

<script src="js/dashboard.js"></script>

</body>
</html>
