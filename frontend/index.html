<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Student Analytics</title>

  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="css/style.css">
</head>

<body class="flex items-center justify-center min-h-screen">

  <!-- Dark Mode Button -->
  <button onclick="toggleTheme()" class="absolute top-5 right-5 px-4 py-2 btn-primary rounded-lg">🌙</button>

  <div class="card p-8 rounded-2xl shadow-xl w-full max-w-md">

    <h2 class="text-2xl font-bold text-center mb-6" style="color: var(--primary-color);">
      Student Analytics
    </h2>

    <!-- Login Form -->
    <form id="authForm" class="space-y-4">

      <input type="text" id="usernameInput" placeholder="Username" class="w-full p-3 border rounded-lg" required />

      <div class="relative">
        <input type="password" id="passwordInput"placeholder="Password" class="w-full p-3 border rounded-lg pr-10"required />
        <span onclick="togglePassword()"class="absolute right-3 top-3 cursor-pointer">👁️</span>
      </div>

      <button class="w-full btn-primary py-3 rounded-lg">Login </button>
    </form>

    <!-- MESSAGE -->
    <p id="message" class="text-center mt-4 text-sm"></p>

    <!-- FORGOT PASSWORD -->
    <p class="text-center mt-3 text-blue-500 cursor-pointer"onclick="forgotPassword()">Forgot Password?</p>

  </div>

  <script src="js/auth.js"></script>

</body>
</html>
