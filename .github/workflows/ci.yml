# =====================================================================
#  Continuous Integration
# =====================================================================
#  This file must live at .github/workflows/ at the REPOSITORY root -
#  GitHub does not look anywhere else. The application itself lives one
#  level down in Foresight/, so:
#
#    * `defaults.run.working-directory` puts every `run:` step inside
#      Foresight/, letting the shell commands use their natural paths;
#    * settings that are NOT run steps - action inputs such as
#      cache-dependency-path and upload-artifact's path - are resolved
#      against the workspace root and must therefore name Foresight/
#      explicitly. That asymmetry is easy to miss and is why those two
#      lines look inconsistent with the rest.
# =====================================================================

name: CI

on:
  push:
    branches: [main, Student-Analytics]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    name: Lint and test
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: Foresight

    # The test suite runs against a real MySQL, because most of the logic
    # worth testing lives in SQL - the views compute the percentages and
    # the triggers reject bad marks. A mocked database would assert that
    # Python calls a query without ever checking the query is right.
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: ci-root-password
          MYSQL_DATABASE: foresight
        ports:
          - 3306:3306
        # The job must not start querying before the server is accepting
        # connections; MySQL's container is up well before it is ready.
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -pci-root-password"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10

    env:
      DB_HOST: 127.0.0.1
      DB_PORT: 3306
      DB_USER: root
      DB_PASSWORD: ci-root-password
      DB_NAME: foresight
      JWT_SECRET: ci-only-secret-not-used-in-production
      DEBUG: "true"

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          # An action input, not a run step: resolved from the workspace
          # root, so the default working-directory does not apply.
          cache-dependency-path: Foresight/backend/requirements*.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt -r backend/requirements-dev.txt

      - name: Wait for MySQL
        run: |
          for i in $(seq 1 30); do
            if mysqladmin ping -h 127.0.0.1 -P 3306 -uroot -p"$DB_PASSWORD" --silent; then
              echo "MySQL is ready"; exit 0
            fi
            echo "waiting for MySQL ($i/30)"; sleep 2
          done
          echo "MySQL never became ready"; exit 1

      - name: Lint
        run: |
          ruff check backend/
          ruff format --check backend/

      - name: Run tests
        # A step-level working-directory REPLACES the job default rather
        # than nesting inside it, so this must spell out the full path.
        working-directory: Foresight/backend
        run: pytest --cov=. --cov-report=term-missing --cov-report=xml

      - name: Upload coverage
        uses: actions/upload-artifact@v4
        # `always()` so the report is still available when a test failed,
        # which is exactly when it is most useful.
        if: always()
        with:
          name: coverage
          # Also an action input - workspace-relative.
          path: Foresight/backend/coverage.xml
          if-no-files-found: ignore

  sql:
    name: Validate SQL scripts
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: Foresight

    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: ci-root-password
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -pci-root-password"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10

    steps:
      - uses: actions/checkout@v4

      - name: Load schema, views, triggers and procedures
        run: |
          MYSQL="mysql -h 127.0.0.1 -P 3306 -uroot -pci-root-password"
          for i in $(seq 1 30); do
            mysqladmin ping -h 127.0.0.1 -uroot -pci-root-password --silent && break
            sleep 2
          done
          for file in schema views triggers procedures sample_data; do
            echo "--- $file.sql"
            $MYSQL < "database/$file.sql"
          done

      - name: Check every object was created
        run: |
          MYSQL="mysql -h 127.0.0.1 -P 3306 -uroot -pci-root-password foresight -N -B"
          views=$($MYSQL -e "SELECT COUNT(*) FROM information_schema.views WHERE table_schema='foresight'")
          triggers=$($MYSQL -e "SELECT COUNT(*) FROM information_schema.triggers WHERE trigger_schema='foresight'")
          routines=$($MYSQL -e "SELECT COUNT(*) FROM information_schema.routines WHERE routine_schema='foresight'")
          echo "views=$views triggers=$triggers routines=$routines"
          # Fails loudly if a script silently stops creating something.
          [ "$views" -ge 6 ] && [ "$triggers" -ge 8 ] && [ "$routines" -ge 7 ]
