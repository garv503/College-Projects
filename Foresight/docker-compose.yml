# =====================================================================
#  Foresight - full stack in one command
# =====================================================================
#     docker compose up --build
#     open http://localhost:5000
#
#  Brings up MySQL, loads the schema, seeds a demo dataset and starts
#  the API. Nothing else needs installing - not Python, not MySQL.
#
#  Note on `.env`: Compose reads it automatically to substitute the
#  ${...} values below. That is deliberate - one file configures both
#  ways of running the project. The settings that *must* differ inside a
#  container (DB_HOST, DB_PORT) are hardcoded here rather than
#  substituted, so a `.env` written for the local terminal - where
#  DB_HOST is `localhost` - cannot break the containers.
#
#  Host ports are overridable so this can run alongside a local server:
#      APP_PORT=5001 docker compose up

name: foresight

services:

  db:
    image: mysql:8.0
    container_name: foresight-db
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD:-devpassword}
      MYSQL_DATABASE: ${DB_NAME:-foresight}
    ports:
      # Exposed so a GUI client can connect. 3307 on the host by default
      # to avoid colliding with a MySQL already installed on the machine.
      - "${DB_HOST_PORT:-3307}:3306"
    volumes:
      - db_data:/var/lib/mysql
      # Everything in this directory runs, in filename order, the first
      # time the container starts with an empty data volume - which is
      # why the SQL files are numbered.
      - ./database/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
      - ./database/views.sql:/docker-entrypoint-initdb.d/02-views.sql:ro
      - ./database/triggers.sql:/docker-entrypoint-initdb.d/03-triggers.sql:ro
      - ./database/procedures.sql:/docker-entrypoint-initdb.d/04-procedures.sql:ro
      - ./database/sample_data.sql:/docker-entrypoint-initdb.d/05-data.sql:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1",
             "-uroot", "-p${DB_PASSWORD:-devpassword}"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s
    command:
      # utf8mb4 end to end, so a name with an accent in it survives.
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci

  seed:
    build: .
    container_name: foresight-seed
    depends_on:
      db:
        condition: service_healthy
    environment: &api-env
      DB_HOST: db
      DB_PORT: 3306
      DB_USER: root
      DB_PASSWORD: ${DB_PASSWORD:-devpassword}
      DB_NAME: ${DB_NAME:-foresight}
      JWT_SECRET: ${JWT_SECRET:-compose-dev-secret-change-me}
      DEBUG: "true"
      CORS_ORIGINS: "*"
    # Runs once, populates the demo data, exits. `restart: "no"` stops
    # Compose from treating that clean exit as a crash and looping.
    #
    # Safe to run again: seed_demo.py does nothing when students already
    # exist, so restarting the stack never destroys data. To rebuild the
    # demo dataset from scratch:
    #     docker compose run --rm seed python seed_demo.py --force
    restart: "no"
    command: ["python", "seed_demo.py"]

  api:
    build: .
    container_name: foresight-api
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
      seed:
        condition: service_completed_successfully
    environment: *api-env
    ports:
      - "${APP_PORT:-5000}:5000"

volumes:
  db_data:
